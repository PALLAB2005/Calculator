<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;600&family=Figtree:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="calc" aria-label="Calculator">
  <div class="screen">
    <div class="expr" id="expr"></div>
    <div class="result" id="result" aria-live="polite">0</div>
  </div>
  <div class="keys" id="keys">
    <button class="fn" data-k="C" aria-label="Clear">C</button>
    <button class="fn" data-k="⌫" aria-label="Backspace">⌫</button>
    <button class="fn" data-k="%" aria-label="Percent">%</button>
    <button class="op" data-k="÷" aria-label="Divide">÷</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="op" data-k="×" aria-label="Multiply">×</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button class="op" data-k="−" aria-label="Subtract">−</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button class="op" data-k="+" aria-label="Add">+</button>
    <button class="zero" data-k="0">0</button>
    <button data-k="." aria-label="Decimal point">.</button>
    <button class="eq" data-k="=" aria-label="Equals">=</button>
  </div>
  <p class="hint">Keyboard: 0–9, + − * /, Enter, Backspace, Esc</p>
</main>
<script src="script.js"></script>
</body>
</html>
